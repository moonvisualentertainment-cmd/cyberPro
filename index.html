<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitleMeta">CyberCafé Pro - Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-800">

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="flex justify-center mb-6">
                <div class="bg-indigo-600 text-white p-4 rounded-xl shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900"><span id="loginBrandName">CyberCafé Pro</span></h1>
                <p class="text-sm text-gray-500 mt-1">Sign in to continue</p>
            </div>

            <div id="loginError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl text-center font-medium">
                Invalid username or password. Check credentials.
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Username</label>
                    <input type="text" id="username" required 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                        placeholder="e.g. admin or staff">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Password</label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                        placeholder="********">
                </div>

                <button type="submit" 
                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                    Sign In
                </button>
            </form>
        </div>
    </div>


    <!-- ==================== MAIN APPLICATION CONTAINER ==================== -->
    <div id="appSection" class="hidden min-h-screen flex bg-slate-100 text-slate-800">
        
        <!-- SIDEBAR NAVIGATION -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between border-r border-slate-800">
            <div>
                <!-- Brand Header -->
                <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-white font-bold text-base"><span class="sidebarBrandName">CyberCafé Pro</span></h1>
                        <p class="text-xs text-slate-500">Management System</p>
                    </div>
                </div>

                <!-- Nav Links -->
                <div class="px-4 py-6 space-y-1">
                    <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Navigation</p>
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
                        <span>Dashboard</span>
                    </button>
                    <button onclick="switchTab('services')" id="nav-services" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>Services Directory</span>
                    </button>
                    <button onclick="switchTab('purchases')" id="nav-purchases" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>Stock Purchases</span>
                    </button>
                    <button onclick="switchTab('inventory')" id="nav-inventory" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>Stock Inventory</span>
                    </button>
                    <button onclick="switchTab('batchUpload')" id="nav-batchUpload" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>📦 Batch Upload Center</span>
                    </button>
                    <button onclick="switchTab('expenses')" id="nav-expenses" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>Expenses</span>
                    </button>
                    <button onclick="switchTab('sales')" id="nav-sales" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>Sales Ledger</span>
                    </button>

                    <p id="adminNavHeading" class="px-3 pt-6 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Administration</p>
                    <button onclick="switchTab('reports')" id="nav-reports" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>Reports</span>
                    </button>
                    <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition hover:bg-slate-800 text-slate-300">
                        <span>Settings & Manager</span>
                    </button>
                </div>
            </div>

            <!-- Sidebar Footer Status -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/40">
                <p class="text-xs text-slate-500 uppercase font-semibold">System Status</p>
                <div class="flex items-center space-x-2 mt-1">
                    <span id="syncIndicatorDot" class="h-2 w-2 rounded-full bg-emerald-400"></span>
                    <span id="syncIndicatorText" class="text-xs text-slate-300 font-medium">Firebase Connected</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Top Header -->
