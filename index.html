<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCafé Pro - Sign In</title>
    <!-- Tailwind CSS for clean, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <!-- Logo / Icon Section -->
        <div class="flex justify-center mb-6">
            <div class="bg-indigo-600 text-white p-4 rounded-xl shadow-lg">
                <!-- Monitor Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
        </div>

        <!-- Header Title -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">CyberCafé <span class="text-indigo-600 font-normal">Pro</span></h1>
            <p class="text-sm text-gray-500 mt-1">Sign in to continue</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Username</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    placeholder="Manager">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200">
                Sign In
            </button>
        </form>

        <!-- Footer Note -->
        <div class="text-center mt-6">
            <p class="text-xs text-gray-400">Access is limited to registered staff and manager accounts.</p>
        </div>
    </div>

    <script>
        // Add your login authentication logic here
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // Example hook for your authentication backend/Firebase
            console.log("Logging in user:", user);
        });
    </script>
</body>
</html>
